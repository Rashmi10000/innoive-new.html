<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamma Construction - Smart Invoice Maker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #f4f7f6; 
            color: #333;
            user-select: none; /* Text copy කිරීම වැළැක්වීමට */
        }
        .invoice-box { 
            max-width: 850px; 
            margin: 10px auto; 
            padding: 20px; 
            background: #fff; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
        }
        .header { 
            display: flex; 
            flex-direction: column;
            gap: 20px;
            border-bottom: 3px solid #f39c12; 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
        }
        .company-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo-container {
            width: 90px;
            height: 90px;
            border: 2px dashed #f39c12;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .logo-placeholder {
            font-size: 11px;
            color: #7f8c8d;
            text-align: center;
            font-weight: 600;
        }

        .company-inputs input, .company-inputs textarea {
            display: block;
            width: 100%;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            font-size: 13px;
            padding: 5px;
            border-radius: 4px;
        }
        .company-inputs .comp-name {
            font-size: 26px;
            font-weight: 700;
            color: #2c3e50;
            border-color: transparent;
            padding: 0;
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .invoice-meta {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            min-width: 250px;
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .meta-row input {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 130px;
        }
        .bill-to h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #2c3e50;
        }
        .bill-to textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th { 
            background-color: #2c3e50; 
            color: white;
            padding: 12px; 
            text-align: left; 
            font-size: 14px;
        }
        td { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
        }
        .item-desc { width: 100%; min-width: 250px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .num-input { width: 100%; text-align: right; min-width: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        
        .amount-word-section {
            margin-top: 15px;
            padding: 10px;
            background-color: #fcf8e3;
            border-left: 5px solid #f39c12;
            font-size: 13px;
            font-weight: 600;
            color: #c0392b;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }
        .notes-card, .totals-card {
            background: #fff;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .notes-card textarea {
            width: 100%;
            height: 110px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            resize: vertical;
        }
        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f5f5f5;
        }
        .totals-row.grand-total {
            font-size: 20px;
            font-weight: 700;
            color: #f39c12;
            border-top: 2px solid #2c3e50;
            border-bottom: none;
            padding-top: 12px;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .btn { 
            padding: 12px; 
            border: none; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            transition: 0.2s;
        }
        .btn-add { background: #fef5e7; color: #d35400; width: 100%; margin-top: 10px;}
        .btn-add:hover { background: #fdebd0; }
        .btn-remove { background: #ffebee; color: #c62828; padding: 6px 10px; }
        .btn-print { background: #f39c12; color: white; font-size: 16px; }
        .btn-print:hover { background: #e67e22; }
        .btn-excel { background: #2980b9; color: white; }
        
        @media (min-width: 600px) {
            body { padding: 30px; }
            .header { flex-direction: row; justify-content: space-between; }
            .bottom-section { flex-direction: row; justify-content: space-between; }
            .notes-card { width: 50%; }
            .totals-card { width: 45%; }
            .actions-grid { grid-template-columns: 1fr 1fr; }
        }

        @media print {
            body { background: white; padding: 0; user-select: auto; }
            .invoice-box { box-shadow: none; padding: 0; border: none; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; padding: 0 !important; }
            .meta-row input { text-align: right; }
            .item-desc, .num-input { border: none; padding: 0; }
            .totals-row input { display: none; }
            .logo-container { border: none; background: transparent; }
        }
    </style>
</head>
<body>

<div class="invoice-box">
    <div class="header">
        <div class="company-section">
            <div>
                <div class="logo-container">
                    <img id="logoImg" src="" style="display:none;">
                    <div id="logoText" class="logo-placeholder">Upload<br>Logo</div>
                </div>
                <input type="file" id="logoFile" accept="image/*" class="no-print" style="font-size: 11px; width: 90px; margin-top: 5px;" onchange="loadLogo(event)">
            </div>
            <div class="company-inputs" style="flex: 1;">
                <input type="text" id="compName" class="comp-name" value="Gamma Construction" readonly>
                <input type="text" id="compTag" value="BUILDING YOUR TRUST WITH QUALITY" style="font-weight:bold; color:#7f8c8d; border-color:transparent; padding:0; background:transparent; margin-top: 5px;" readonly>
                <textarea id="compDetails" rows="3" style="border-color:transparent; padding:0; color:#555; background:transparent; margin-top: 5px; font-family: inherit; line-height: 1.5;" readonly>ප්‍රධාන ශාඛාව: මිරිස්වත්ත
Hotline: 074 394 3221 / 077 165 7441
Email: gammaconstruction@email.com</textarea>
            </div>
        </div>
        
        <div class="invoice-meta">
            <h2 style="margin: 0 0 10px 0; color: #f39c12; text-align: right; font-size: 28px; letter-spacing: 1px;">INVOICE</h2>
            <div class="meta-row">
                <label><b>Inv No:</b></label>
                <input type="text" id="invoiceNum" value="GMC-26-001" readonly style="font-weight: bold; background: transparent; border: none; text-align: right;">
            </div>
            <div class="meta-row">
                <label><b>Date:</b></label>
                <input type="date" id="invDate">
            </div>
        </div>
    </div>

    <div class="bill-to">
        <h3>Invoice To (Client):</h3>
        <textarea rows="3" placeholder="Client Name&#10;Project Site Location Address&#10;Contact Number"></textarea>
    </div>

    <div class="table-responsive">
        <table id="invoiceTable">
            <thead>
                <tr>
                    <th style="width: 55%">Description of Work / Materials (BOQ Item)</th>
                    <th style="width: 10%; text-align: right;">Qty</th>
                    <th style="width: 15%; text-align: right;">Rate (Rs)</th>
                    <th style="width: 15%; text-align: right;">Amount (Rs)</th>
                    <th class="no-print" style="width: 5%"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" class="item-desc" placeholder="Ex: Concrete Slab Construction / Material Supply"></td>
                    <td><input type="number" class="num-input qty" value="1" min="0" step="any" oninput="calculate()"></td>
                    <td><input type="number" class="num-input price" value="0" min="0" oninput="calculate()"></td>
                    <td class="row-total" style="text-align: right;">0.00</td>
                    <td class="no-print"><button class="btn btn-remove" onclick="removeRow(this)">X</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <button class="btn btn-add no-print" onclick="addRow()">+ Add New BOQ Item / Work Line</button>

    <div id="amountInWords" class="amount-word-section">Amount in Words: Rupees Zero Only.</div>

    <div class="bottom-section">
        <div class="notes-card">
            <b style="font-size: 14px; display:block; margin-bottom: 5px;">Payment Terms & Notes:</b>
            <textarea id="compNotes" placeholder="Bank details or Warranty information...">Bank Details:
Bank Name: 
Account No: 
Name: Gamma Construction
Branch: </textarea>
        </div>
        <div class="totals-card">
            <div class="totals-row">
                <span>Subtotal:</span>
                <span id="subTotal">0.00</span>
            </div>
            <div class="totals-row no-print">
                <span>Discount (%):</span>
                <input type="number" id="discPer" class="num-input" value="0" style="width: 60px; padding: 5px;" oninput="calculate()">
            </div>
            <div class="totals-row" style="color: #c0392b;">
                <span>Discount Amount:</span>
                <span id="discAmt">0.00</span>
            </div>
            <div class="totals-row grand-total">
                <span>Total Amount:</span>
                <span>Rs <span id="grandTotal">0.00</span></span>
            </div>
        </div>
    </div>

    <div class="actions-grid no-print">
        <button class="btn btn-excel" onclick="exportToExcel()">📊 Download BOQ Data (CSV)</button>
        <button class="btn btn-print" onclick="triggerPrint()">🖨️ Print / Save PDF</button>
    </div>
</div>

<script>
    document.getElementById('invDate').valueAsDate = new Date();

    window.onload = function() {
        // Auto Invoice Number setup
        if(!localStorage.getItem('gmc_invCounter')) {
            localStorage.setItem('gmc_invCounter', '1');
        }
        updateInvoiceNumberDisplay();

        if(localStorage.getItem('gmc_logoData')) {
            document.getElementById('logoImg').src = localStorage.getItem('gmc_logoData');
            document.getElementById('logoImg').style.display = 'block';
            document.getElementById('logoText').style.display = 'none';
        }
    }

    function updateInvoiceNumberDisplay() {
        let count = localStorage.getItem('gmc_invCounter');
        let paddedCount = count.padStart(3, '0');
        document.getElementById('invoiceNum').value = `GMC-26-${paddedCount}`;
    }

    function loadLogo(event) {
        let reader = new FileReader();
        reader.onload = function() {
            let img = document.getElementById('logoImg');
            img.src = reader.result;
            img.style.display = 'block';
            document.getElementById('logoText').style.display = 'none';
            localStorage.setItem('gmc_logoData', reader.result);
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    function calculate() {
        let rows = document.querySelectorAll('#invoiceTable tbody tr');
        let subTotal = 0;
        rows.forEach(row => {
            let qty = row.querySelector('.qty').value || 0;
            let price = row.querySelector('.price').value || 0;
            let total = parseFloat(qty) * parseFloat(price);
            row.querySelector('.row-total').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            subTotal += total;
        });
        document.getElementById('subTotal').innerText = subTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        let discPer = parseFloat(document.getElementById('discPer').value) || 0;
        let discAmt = subTotal * (discPer / 100);
        document.getElementById('discAmt').innerText = "-" + discAmt.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        let grandTotal = subTotal - discAmt;
        document.getElementById('grandTotal').innerText = grandTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        // Convert Grand Total to Words
        document.getElementById('amountInWords').innerText = "Amount in Words: " + numberToWords(Math.round(grandTotal)) + " Only.";
    }

    function addRow() {
        let tbody = document.querySelector('#invoiceTable tbody');
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="item-desc" placeholder="Item description"></td>
            <td><input type="number" class="num-input qty" value="1" min="0" step="any" oninput="calculate()"></td>
            <td><input type="number" class="num-input price" value="0" min="0" oninput="calculate()"></td>
            <td class="row-total" style="text-align: right;">0.00</td>
            <td class="no-print"><button class="btn btn-remove" onclick="removeRow(this)">X</button></td>
        `;
        tbody.appendChild(tr);
    }

    function removeRow(btn) {
        btn.closest('tr').remove();
        calculate();
    }

    function triggerPrint() {
        window.print();
        // පින්ට් කිරීමෙන් පසු ඉන්වොයිස් අංකය එකකින් වැඩි කර සේව් කරයි
        let currentCount = parseInt(localStorage.getItem('gmc_invCounter'));
        localStorage.setItem('gmc_invCounter', (currentCount + 1).toString());
        updateInvoiceNumberDisplay();
    }

    function exportToExcel() {
        let rows = document.querySelectorAll('#invoiceTable tbody tr');
        let csvContent = "data:text/csv;charset=utf-8,Description,Qty,Rate,Total\n";
        rows.forEach(row => {
            let desc = row.querySelector('.item-desc').value || "";
            let qty = row.querySelector('.qty').value || 0;
            let price = row.querySelector('.price').value || 0;
            let total = qty * price;
            csvContent += `"${desc}",${qty},${price},${total}\n`;
        });
        csvContent += `\n,,,Grand Total,${document.getElementById('grandTotal').innerText}`;
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Gamma_Construction_${document.getElementById('invoiceNum').value}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Number to Words Converter Function
    function numberToWords(num) {
        if (num === 0) return 'Rupees Zero';
        const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
        
        function g(n) {
            if (n < 20) return a[n];
            let d = n % 10;
            return b[Math.floor(n / 10)] + (d ? ' ' + a[d] : '');
        }
        function h(n) {
            if (n === 0) return '';
            let t = Math.floor(n / 100);
            let r = n % 100;
            return (t ? a[t] + ' Hundred ' : '') + (r ? g(r) : '');
        }
        let str = 'Rupees ';
        let k = Math.floor(num / 10000000);
        let m = Math.floor((num % 10000000) / 100000);
        let t = Math.floor((num % 100000) / 1000);
        let r = num % 1000;
        
        if (k) str += h(k) + ' Crore ';
        if (m) str += h(m) + ' Lakh ';
        if (t) str += h(t) + ' Thousand ';
        if (r) str += h(r);
        return str.replace(/\s+/g, ' ').trim();
    }

    // Security Features: කේතය සොරකම් කිරීම වැළැක්වීමට (Anti-Theft Features)
    document.addEventListener('contextmenu', event => event.preventDefault()); // Right Click Block
    
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false; // F12 Block
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Inspect Element Block
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; 
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // View Source Block
        if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false; // Save Page Block
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false; // Direct Print Block
    }
</script>

</body>
</html>
