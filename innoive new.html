<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecohome Electrical - Smart Invoice Maker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #f4f7f6; 
            color: #333;
        }
        .invoice-box { 
            max-width: 850px; 
            margin: 10px auto; 
            padding: 20px; 
            background: #fff; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
        }
        .header { 
            display: flex; 
            flex-direction: column;
            gap: 20px;
            border-bottom: 2px solid #e0e0e0; 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
        }
        .company-section {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
        }

        .company-inputs input, .company-inputs textarea {
            display: block;
            width: 100%;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            font-size: 13px;
            padding: 5px;
            border-radius: 4px;
        }
        .company-inputs .comp-name {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            border-color: transparent;
            padding: 0;
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .invoice-meta {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            min-width: 250px;
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .meta-row input {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 130px;
        }
        .bill-to h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #2c3e50;
        }
        .bill-to textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th { 
            background-color: #2c3e50; 
            color: white;
            padding: 12px; 
            text-align: left; 
            font-size: 14px;
        }
        td { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
        }
        .item-desc { width: 100%; min-width: 180px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .num-input { width: 100%; text-align: right; min-width: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }
        .notes-card, .totals-card {
            background: #fff;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .notes-card textarea {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            resize: vertical;
        }
        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f5f5f5;
        }
        .totals-row.grand-total {
            font-size: 20px;
            font-weight: 700;
            color: #27ae60;
            border-top: 2px solid #2c3e50;
            border-bottom: none;
            padding-top: 12px;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .btn { 
            padding: 12px; 
            border: none; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            transition: 0.2s;
        }
        .btn-add { background: #e0f2f1; color: #00897b; width: 100%; margin-top: 10px;}
        .btn-remove { background: #ffebee; color: #c62828; padding: 6px 10px; }
        .btn-print { background: #27ae60; color: white; font-size: 16px; }
        .btn-excel { background: #2980b9; color: white; }
        
        /* Desktop view optimization */
        @media (min-width: 600px) {
            body { padding: 30px; }
            .header { flex-direction: row; justify-content: space-between; }
            .bottom-section { flex-direction: row; justify-content: space-between; }
            .notes-card { width: 50%; }
            .totals-card { width: 45%; }
            .actions-grid { grid-template-columns: 1fr 1fr; }
        }

        /* Print Settings */
        @media print {
            body { background: white; padding: 0; }
            .invoice-box { box-shadow: none; padding: 0; border: none; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; padding: 0 !important; }
            .meta-row input { text-align: right; }
            .item-desc, .num-input { border: none; padding: 0; }
            .totals-row input { display: none; }
        }
    </style>
</head>
<body>

<div class="invoice-box">
    <!-- Header Section -->
    <div class="header">
        <div class="company-section">
            <div class="company-inputs" style="flex: 1;">
                <input type="text" id="compName" class="comp-name" value="Ecohome" oninput="saveProfile()">
                <input type="text" id="compTag" value="ELECTRICAL ENGINEERING SERVICES" style="font-weight:bold; color:#7f8c8d; border-color:transparent; padding:0; background:transparent; margin-top: 5px;" oninput="saveProfile()">
                <textarea id="compDetails" rows="3" style="border-color:transparent; padding:0; color:#555; background:transparent; margin-top: 5px;" oninput="saveProfile()" placeholder="Address, Tel, Email">Gampaha,Miriswaththa
Tel: 076 8310 352 | Email: ecohomeelectrical@gmail.com</textarea>
            </div>
        </div>
        
        <div class="invoice-meta">
            <h2 style="margin: 0 0 10px 0; color: #27ae60; text-align: right; font-size: 28px;">INVOICE</h2>
            <div class="meta-row">
                <label><b>Inv No:</b></label>
                <input type="text" value="INV-26-0001">
            </div>
            <div class="meta-row">
                <label><b>Date:</b></label>
                <input type="date" id="invDate">
            </div>
        </div>
    </div>

    <!-- Client Info -->
    <div class="bill-to">
        <h3>Invoice To:</h3>
        <textarea rows="3" placeholder="Customer Name&#10;Address&#10;Phone Number"></textarea>
    </div>

    <!-- Items Table -->
    <div class="table-responsive">
        <table id="invoiceTable">
            <thead>
                <tr>
                    <th style="width: 50%">Description of Work / Materials</th>
                    <th style="width: 10%; text-align: right;">Qty</th>
                    <th style="width: 15%; text-align: right;">Rate (Rs)</th>
                    <th style="width: 20%; text-align: right;">Amount (Rs)</th>
                    <th class="no-print" style="width: 5%"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" class="item-desc" placeholder="Ex: DB Box installation"></td>
                    <td><input type="number" class="num-input qty" value="1" min="1" oninput="calculate()"></td>
                    <td><input type="number" class="num-input price" value="0" min="0" oninput="calculate()"></td>
                    <td class="row-total" style="text-align: right;">0.00</td>
                    <td class="no-print"><button class="btn btn-remove" onclick="removeRow(this)">X</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <button class="btn btn-add no-print" onclick="addRow()">+ Add New Line</button>

    <!-- Bottom Breakdown -->
    <div class="bottom-section">
        <div class="notes-card">
            <b style="font-size: 14px; display:block; margin-bottom: 5px;">Notes & Payment Terms:</b>
            <textarea id="compNotes" oninput="saveProfile()" placeholder="Bank details or Warranty information...">Bank Details: 
Bank Name: Sampath Bank
Account No: 1071 5207 9728
Name:Ecohome </textarea>
        </div>
        <div class="totals-card">
            <div class="totals-row">
                <span>Subtotal:</span>
                <span id="subTotal">0.00</span>
            </div>
            <div class="totals-row no-print">
                <span>Discount (%):</span>
                <input type="number" id="discPer" class="num-input" value="0" style="width: 60px; padding: 5px;" oninput="calculate()">
            </div>
            <div class="totals-row" style="color: #c0392b;">
                <span>Discount Amount:</span>
                <span id="discAmt">0.00</span>
            </div>
            <div class="totals-row grand-total">
                <span>Total:</span>
                <span>Rs <span id="grandTotal">0.00</span></span>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions-grid no-print">
        <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel (CSV)</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
</div>

<script>
    document.getElementById('invDate').valueAsDate = new Date();

    window.onload = function() {
        if(localStorage.getItem('compName')) document.getElementById('compName').value = localStorage.getItem('compName');
        if(localStorage.getItem('compTag')) document.getElementById('compTag').value = localStorage.getItem('compTag');
        if(localStorage.getItem('compDetails')) document.getElementById('compDetails').value = localStorage.getItem('compDetails');
        if(localStorage.getItem('compNotes')) document.getElementById('compNotes').value = localStorage.getItem('compNotes');
    }

    function saveProfile() {
        localStorage.setItem('compName', document.getElementById('compName').value);
        localStorage.setItem('compTag', document.getElementById('compTag').value);
        localStorage.setItem('compDetails', document.getElementById('compDetails').value);
        localStorage.setItem('compNotes', document.getElementById('compNotes').value);
    }

    function calculate() {
        let rows = document.querySelectorAll('#invoiceTable tbody tr');
        let subTotal = 0;
        rows.forEach(row => {
            let qty = row.querySelector('.qty').value || 0;
            let price = row.querySelector('.price').value || 0;
            let total = parseFloat(qty) * parseFloat(price);
            row.querySelector('.row-total').innerText = total.toFixed(2);
            subTotal += total;
        });
        document.getElementById('subTotal').innerText = subTotal.toFixed(2);
        
        let discPer = parseFloat(document.getElementById('discPer').value) || 0;
        let discAmt = subTotal * (discPer / 100);
        document.getElementById('discAmt').innerText = "-" + discAmt.toFixed(2);
        
        document.getElementById('grandTotal').innerText = (subTotal - discAmt).toFixed(2);
    }

    function addRow() {
        let tbody = document.querySelector('#invoiceTable tbody');
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="item-desc" placeholder="Item description"></td>
            <td><input type="number" class="num-input qty" value="1" min="1" oninput="calculate()"></td>
            <td><input type="number" class="num-input price" value="0" min="0" oninput="calculate()"></td>
            <td class="row-total" style="text-align: right;">0.00</td>
            <td class="no-print"><button class="btn btn-remove" onclick="removeRow(this)">X</button></td>
        `;
        tbody.appendChild(tr);
    }

    function removeRow(btn) {
        btn.closest('tr').remove();
        calculate();
    }

    function exportToExcel() {
        let rows = document.querySelectorAll('#invoiceTable tbody tr');
        let csvContent = "data:text/csv;charset=utf-8,Description,Qty,Rate,Total\n";
        rows.forEach(row => {
            let desc = row.querySelector('.item-desc').value || "";
            let qty = row.querySelector('.qty').value || 0;
            let price = row.querySelector('.price').value || 0;
            let total = qty * price;
            csvContent += `"${desc}",${qty},${price},${total}\n`;
        });
        csvContent += `\n,,,Grand Total,${document.getElementById('grandTotal').innerText}`;
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Invoice_Data.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
